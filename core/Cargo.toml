[package]
name = "nlf-core"
version = "0.1.0"
edition = "2024"
default-run = "nlf-core"

[lib]
name = "nlf_core"

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
ctor = "0.6.1"
indexmap = "2.11.4"
inline_colorization = "0.1.6"
lazy_static = "1.5.0"
libloading = "0.9.0"
parking_lot = "0.12.5"
rand = "0.9.2"
rayon = "1.11.0"
reqwest = { version = "0.12.14", features = ["blocking", "json"] }
rust-embed = { version = "8.9.0", features = ["include-exclude"]}
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
strum = { version = "0.27.2", features = ["derive"] }
# types = { path = "./types"}
nlf-shared = { path = "../shared"}
nlf-macros = { path = "../macros" }